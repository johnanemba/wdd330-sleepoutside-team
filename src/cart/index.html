
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration | Sleep Outside</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    header {
      background: #304c65;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .register-container {
      max-width: 500px;
      margin: 40px auto;
      padding: 25px;
      background: white;
      border-radius: 8px;
    }

    .register-container label {
      display: block;
      margin-top: 15px;
    }

    .register-container input {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      box-sizing: border-box;
    }

    .register-container button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: #304c65;
      color: white;
      border: none;
      cursor: pointer;
    }

    .register-container button:disabled {
      background: gray;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Sleep Outside</h1>
  </header>

  <main class="register-container">
    <h2>Create Your Account</h2>

    <form id="register-form">

      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>

      <label for="address">Address</label>
      <input type="text" id="address" name="address" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        minlength="8"
        required
      >

      <button type="submit" id="register-button">
        Register
      </button>

    </form>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script type="module" src="./register/register.js"></script>
</body>
</html>
